name: Daily LeetCode reminder

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Notion secret format
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi
          case "$NOTION_TOKEN" in
            NOTION_TOKEN=*|\"*|\'*|*\ *|*$'\n'*)
              echo "NOTION_TOKEN must contain only the raw token, without NOTION_TOKEN=, quotes, or whitespace."
              exit 1
              ;;
          esac
          echo "NOTION_TOKEN is present and has the expected format."

      - name: Send daily reminder
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python agent.py